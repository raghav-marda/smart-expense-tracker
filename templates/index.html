<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <h1>💰 Smart Expense Tracker</h1>
        <div>
            👤 {{ user }} |
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- FLASH -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
        {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="wrapper">

        <!-- LEFT -->
        <div class="left">

            <!-- MONTH FILTER -->
            <select id="month-filter">
                <option value="">📅 All Months</option>
                <option value="01">Jan</option>
                <option value="02">Feb</option>
                <option value="03">Mar</option>
                <option value="04">Apr</option>
                <option value="05">May</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Aug</option>
                <option value="09">Sep</option>
                <option value="10">Oct</option>
                <option value="11">Nov</option>
                <option value="12">Dec</option>
            </select>

            <!-- FORM -->
            <form id="expense-form">
                <input type="text" id="expense-name" placeholder="Enter Expense" required>
                <input type="number" id="expense-amount" placeholder="Amount" required>

                <select id="category">
                    <option value="Food">🍔 Food</option>
                    <option value="Travel">✈️ Travel</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Other">📦 Other</option>
                </select>

                <br>
                <button type="submit" class="add-btn">+ Add Expense</button>
            </form>

            <!-- EXPORT -->
            <button onclick="exportData()" 
                style="margin-top:10px; padding:10px 15px; background:#007bff; color:white; border:none; border-radius:6px; cursor:pointer;">
                ⬇ Export Data
            </button>

            <!-- EXPENSE LIST -->
            <h2>📋 Expenses</h2>
            <h3>Total: ₹<span id="total">0</span></h3>

            <ul id="expense-list"></ul>

        </div>

        <!-- RIGHT -->
        <div class="right">
            <h2 style="text-align:center;">📊 Analytics</h2>

            <!-- PIE CHART -->
            <div style="width:300px; margin:auto;">
                <canvas id="expenseChart"></canvas>
            </div>

            <!-- LINE CHART -->
            <div style="width:100%; height:300px; margin-top:30px;">
                <canvas id="monthlyChart"></canvas>
            </div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
